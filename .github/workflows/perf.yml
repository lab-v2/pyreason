name: perf

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      band:
        description: "2k, 10k, or both"
        default: "both"
        type: choice
        options:
          - both
          - 2k
          - 10k

jobs:
  pokec-2k:
    if: >
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.band == '2k' ||
       github.event.inputs.band == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Pokec 2k bench
        run: |
          python benchmarks/pokec/run_bench.py \
            --fixture benchmarks/pokec/fixtures/pokec-2k.graphml \
            --customers benchmarks/pokec/fixtures/pokec-2k-customers.json \
            --repeats 3 --band pokec-2k --out pokec-2k-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokec-2k-report
          path: pokec-2k-report.json

  pokec-10k:
    # Nightly, manual dispatch, or a PR labeled "pokec-10k" (opt-in; not every PR).
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.band == '10k' || github.event.inputs.band == 'both')) ||
      (github.event_name == 'pull_request' &&
       contains(join(github.event.pull_request.labels.*.name, ','), 'pokec-10k'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Restore 10k fixture
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: benchmarks/pokec/fixtures/pokec-10k*
          key: pokec-10k-fixture-${{ hashFiles('benchmarks/pokec/generate_fixtures.py') }}
      - name: Generate 10k fixture (cache miss only)
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p benchmarks/pokec/data
          curl -sSf -o benchmarks/pokec/data/soc-pokec-relationships.txt.gz \
            https://snap.stanford.edu/data/soc-pokec-relationships.txt.gz
          curl -sSf -o benchmarks/pokec/data/soc-pokec-profiles.txt.gz \
            https://snap.stanford.edu/data/soc-pokec-profiles.txt.gz
          python benchmarks/pokec/generate_fixtures.py \
            --data-dir benchmarks/pokec/data --rungs 10k --write
      - name: Pokec 10k bench
        run: |
          python benchmarks/pokec/run_bench.py \
            --fixture benchmarks/pokec/fixtures/pokec-10k.graphml \
            --customers benchmarks/pokec/fixtures/pokec-10k-customers.json \
            --repeats 1 --band pokec-10k --out pokec-10k-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokec-10k-report
          path: pokec-10k-report.json
